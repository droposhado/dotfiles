# borgmatic configuration
# Convertido do perfil Vorta "Default"
# Data de conversão: 2026-07-08
#
# ANTES DE USAR:
#   1. Preencha a senha/passphrase do repositório (veja seção "storage")
#   2. Certifique-se que a chave SSH está configurada (~/.ssh/config ou ssh-agent)
#   3. Instale borgmatic: pip install borgmatic
#   4. Valide este arquivo: borgmatic config validate --config borgmatic.yaml
#   5. Configure agendamento via cron ou systemd (veja comentários no final)

repositories:
  - path: ${BORG_REPO_SSH}
    label: borgbase

source_directories:
  - ${HOME}/projects
  - ${HOME}/docs

# ------------------------------------------------------------
# Armazenamento
# ------------------------------------------------------------

# Escolha UMA das opções abaixo para a senha do repositório:
#
# Opção A — senha em texto plano (menos seguro):
# encryption_passphrase: "sua-senha-aqui"
#
# Opção B — senha via comando (recomendado, ex: secret-tool, pass, etc.):
# encryption_passcommand: secret-tool lookup borg-backup borgbase
#
# Opção C — senha via variável de ambiente:
# (exporte BORG_PASSPHRASE=... antes de rodar borgmatic)

compression: lz4

archive_name_format: "{hostname}-{now:%Y-%m-%d-%H%M%S}"
#match_archives: "sh:machine-*"

# ------------------------------------------------------------
