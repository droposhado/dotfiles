# ------------------------------------------------------------
# Retenção / Pruning
# No Vorta estava DESATIVADO (prune_on: false).
# Descomente abaixo para ativar.
# ------------------------------------------------------------

# keep_within: 10H   # manter todos os backups das últimas 10 horas
# keep_daily: 7
# keep_weekly: 4
# keep_monthly: 6
# keep_yearly: 2
# prefix: "{hostname}-"

# ------------------------------------------------------------
# Verificações de consistência
# Vorta: validation_on=true, validation_weeks=3
# ------------------------------------------------------------

checks:
  - name: repository
    frequency: 3 weeks
  - name: archives
    frequency: 3 weeks

# ------------------------------------------------------------
# Hooks (equivalente aos pre/post backup commands do Vorta)
# Descomente e preencha se necessário:
# ------------------------------------------------------------

# hooks:
#   before_backup:
#     - echo "Iniciando backup..."
#   after_backup:
#     - echo "Backup concluído."
#   on_error:
#     - echo "Erro no backup!"

pushover:
    token: ${PUSHOVER_TOKEN}
    user: ${PUSHOVER_USER}

    start:
        title: Backup iniciado
        message: O borgmatic começou o backup
        priority: -1
        sound: pushover

    finish:
        title: Backup concluído
        message: Backup finalizado com sucesso
        priority: 0
        sound: magic

    fail:
        title: Backup FALHOU
        message: Verifique os logs do borgmatic
        priority: 2
        expire: 600
        retry: 30
        sound: siren

    states:
        - start
        - finish
        - fail

# ------------------------------------------------------------
# AGENDAMENTO
#
# O borgmatic não gerencia o agendamento — use cron ou systemd.
#
# Vorta estava configurado para: a cada 1 hora
#
# Opção A — cron (edite com: crontab -e):
#   0 * * * * borgmatic --config /caminho/para/borgmatic.yaml
#
# Opção B — systemd timer (recomendado no Linux):
#   borgmatic também instala units prontas:
#   sudo systemctl enable --now borgmatic.timer
#   (ajuste o timer em /etc/systemd/system/borgmatic.timer)
# ------------------------------------------------------------
