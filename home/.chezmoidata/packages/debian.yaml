---
packages:
  debian:
    base:
      - neovim
      - starship

      # backup
      - borgbackup

      # mail
      - offlineimap3
      - imapfilter

      # (card, cal) * DAV
      - vdirsyncer

      # file system
      - cifs-utils
      - exfat-fuse
      - jmtpfs
      - ntfs-3g

    network:
      # network (bare-metal / VPS only, not installed on WSL)
      - systemd-resolved

    amd:
      # amd/ati graphics - https://wiki.debian.org/AtiHowTo
      - firmware-amd-graphics
      - libgl1-mesa-dri
      - libglx-mesa0
      - mesa-vulkan-drivers
      - xserver-xorg-video-all

    dev:
      # basic
      - bison
      - gdb
      - tmux

      # pyenv - https://github.com/pyenv/pyenv/wiki#suggested-build-environment
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev

      # i3status-rust
      # libssl-dev # already exists in pyenv
      - libsensors-dev
      - libpulse-dev
      - libnotmuch-dev

    gui:
      # i3
      - xorg
      - i3-wm
      - i3lock
      - suckless-tools
      - dunst

      # font utils
      - fontconfig

      # fonts (terminal)
      - fonts-firacode

      # fonts (japanese support)
      - fonts-takao-mincho
      - fonts-takao

      # https://en.wikipedia.org/wiki/Help:Multilingual_support_(East_Asian)
      - fonts-arphic-ukai
      - fonts-arphic-uming
      - fonts-ipafont-mincho
      - fonts-ipafont-gothic
      - fonts-unfonts-core

      # i3 volume binds
      - alsa-utils
      - playerctl

      # dmenu opens
      - xdg-utils

      # screenshot
      - xdotool
      - maim

      # volume control
      - pulseaudio
      - pavucontrol

      # software packages
      - alacritty
      - firefox-esr
      - rxvt-unicode
      - mlocate
      - transmission
      - mpv
      - rofi
      - zathura
      - xclip

      # diff GUI tool
      - meld

      # backup (GUI)
      - vorta

      # horizonte
      - python3-alsaaudio
      - python3-psutil
